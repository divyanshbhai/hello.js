<!DOCTYPE html>
<html>
<head>
    <title>Twitter Login Fix Test</title>
    <script src="src/hello.polyfill.js"></script>
    <script src="src/hello.js"></script>
    <script src="src/modules/twitter.js"></script>
</head>
<body>
    <h1>Twitter Login Fix Test</h1>
    
    <button id="login-btn" onclick="testTwitterLogin()">Test Twitter Login</button>
    <button id="api-btn" onclick="testTwitterAPI()" disabled>Test Twitter API (/me)</button>
    <button id="logout-btn" onclick="testTwitterLogout()" disabled>Logout</button>
    
    <div id="status"></div>
    <div id="result"></div>

    <script>
        // Initialize HelloJS with a test Twitter client ID
        hello.init({
            twitter: 'test_client_id' // Replace with actual client ID for real testing
        }, {
            redirect_uri: window.location.href.split('#')[0],
            oauth_proxy: 'https://auth-server.herokuapp.com/proxy'
        });

        function log(message) {
            document.getElementById('status').innerHTML += '<p>' + message + '</p>';
        }

        function testTwitterLogin() {
            log('Testing Twitter login...');
            
            hello('twitter').login().then(function(auth) {
                log('✅ Login successful!');
                log('Network: ' + auth.network);
                log('Access token present: ' + (auth.authResponse.access_token ? 'Yes' : 'No'));
                
                document.getElementById('api-btn').disabled = false;
                document.getElementById('logout-btn').disabled = false;
                document.getElementById('login-btn').disabled = true;
                
            }, function(error) {
                log('❌ Login failed: ' + (error.error ? error.error.message : 'Unknown error'));
            });
        }

        function testTwitterAPI() {
            log('Testing Twitter API call (/me)...');
            
            hello('twitter').api('me').then(function(profile) {
                log('✅ API call successful!');
                log('User: ' + profile.name + ' (@' + profile.screen_name + ')');
                
                document.getElementById('result').innerHTML = 
                    '<h3>Profile Data:</h3>' +
                    '<img src="' + profile.thumbnail + '" alt="Profile picture" style="width:50px;height:50px;border-radius:25px;">' +
                    '<p><strong>Name:</strong> ' + profile.name + '</p>' +
                    '<p><strong>Screen Name:</strong> @' + profile.screen_name + '</p>' +
                    '<p><strong>ID:</strong> ' + profile.id + '</p>';
                    
            }, function(error) {
                log('❌ API call failed: ' + (error.error ? error.error.message : 'Unknown error'));
                console.error('API Error:', error);
            });
        }

        function testTwitterLogout() {
            log('Testing Twitter logout...');
            
            hello('twitter').logout().then(function() {
                log('✅ Logout successful!');
                
                document.getElementById('api-btn').disabled = true;
                document.getElementById('logout-btn').disabled = true;
                document.getElementById('login-btn').disabled = false;
                document.getElementById('result').innerHTML = '';
                
            }, function(error) {
                log('❌ Logout failed: ' + (error.error ? error.error.message : 'Unknown error'));
            });
        }

        // Check if already logged in
        hello.on('auth.login', function(auth) {
            if (auth.network === 'twitter') {
                log('Already logged in to Twitter');
                document.getElementById('api-btn').disabled = false;
                document.getElementById('logout-btn').disabled = false;
                document.getElementById('login-btn').disabled = true;
            }
        });

        // Initialize
        hello.init();
    </script>
</body>
</html>
